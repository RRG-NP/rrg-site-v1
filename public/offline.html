<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · RRG Tech</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
        background: #000;
        color: #e6e0e9;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .badge {
        font-size: 0.7rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #ccc2dc;
        border: 1px solid rgba(204, 194, 220, 0.4);
        border-radius: 999px;
        padding: 0.4rem 1rem;
      }
      h1 {
        font-size: clamp(1.6rem, 6vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        max-width: 28rem;
        line-height: 1.6;
        color: rgba(230, 224, 233, 0.6);
      }
      a {
        margin-top: 0.5rem;
        display: inline-block;
        padding: 0.75rem 1.75rem;
        border-radius: 999px;
        background: #ccc2dc;
        color: #000;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <span class="badge">RRG Tech</span>
    <h1>You're offline</h1>
    <p>
      It looks like you've lost your connection. Check your network and try again - your last
      visited pages may still be available.
    </p>
    <a href="/">Retry</a>
  </body>
</html>
